<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<link rel="stylesheet" href="css/admin-dashboard.css">

</head>

<body>

<header>

<h1>🎓 Student Portal Admin</h1>

</header>

<div class="container">

<h2>Add Student</h2>

<input id="regno" placeholder="Register Number">

<input id="name" placeholder="Student Name">

<input id="dob" type="date">

<input id="department" placeholder="Department">

<input id="semester" placeholder="Semester">

<input id="cgpa" placeholder="CGPA">

<input id="percentage" placeholder="Percentage">

<input id="total" placeholder="Total Marks">

<input id="result" placeholder="PASS / FAIL">
<button onclick="saveStudent()">

Save Student

</button>

</div>

<script type="module" src="js/admin-dashboard.js"></script>

</body>
</html>
